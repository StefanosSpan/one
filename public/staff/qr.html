<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Εκτύπωση QR τραπεζιών</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: #fff; }
    .toolbar { padding: 1rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .sheetgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62mm, 1fr)); gap: 6mm; padding: 6mm; }
    .qcard { border: 1px solid #d9d2c3; border-radius: 6mm; padding: 6mm 5mm; text-align: center; break-inside: avoid;
      background: linear-gradient(180deg, #fffdf8, #f8f1e4); }
    .qcard .rn { font-family: 'Fraunces', Georgia, serif; font-size: 15pt; font-weight: 700; color: #14213d; }
    .qcard .tn { display: inline-block; margin: 2mm 0 3mm; padding: 1mm 4mm; border-radius: 99px; background: #14213d; color: #f4e3c1;
      font-weight: 600; font-size: 11pt; letter-spacing: .04em; }
    .qcard .qr { width: 42mm; height: 42mm; margin: 0 auto; background: #fff; padding: 2mm; border-radius: 3mm; }
    .qcard .qr svg { width: 100%; height: 100%; }
    .qcard .cta { font-size: 9.5pt; font-weight: 600; margin-top: 3mm; color: #14213d; }
    .qcard .sub { font-size: 8pt; color: #6b6558; margin-top: 1mm; line-height: 1.35; }
    .qcard .flags { font-size: 11pt; margin-top: 2mm; letter-spacing: 1px; }
    @media print { .toolbar { display: none; } .sheetgrid { padding: 0; } @page { margin: 10mm; } }
  </style>
</head>
<body>
  <div id="toasts"></div>
  <div class="toolbar">
    <button class="btn" onclick="print()">🖨️ Εκτύπωση</button>
    <span class="muted small">Εκτυπώστε σε αυτοκόλλητο ή χαρτόνι και τοποθετήστε ένα σε κάθε τραπέζι. Κάθε QR αντιστοιχεί σε συγκεκριμένο τραπέζι.</span>
  </div>
  <div class="sheetgrid" id="grid"><div class="spinner"></div></div>
  <script type="module">
    import { api, esc } from '/js/util.js';
    import { LANGUAGES } from '/js/i18n.js';
    try {
      const [tables, s] = await Promise.all([api('/api/admin/tables'), api('/api/admin/settings')]);
      const flags = s.languages.map((l) => LANGUAGES[l].flag).join(' ');
      const active = tables.filter((t) => t.active);
      const svgs = await Promise.all(active.map((t) => fetch(`/api/admin/tables/${t.id}/qr.svg`).then((r) => r.text())));
      document.getElementById('grid').innerHTML = active.map((t, i) => `
        <div class="qcard">
          <div class="rn">${esc(s.restaurant.name)}</div>
          <div class="tn">ΤΡΑΠΕΖΙ ${esc(t.label)}</div>
          <div class="qr">${svgs[i]}</div>
          <div class="cta">Σκανάρετε για μενού & παραγγελία</div>
          <div class="sub">Scan for menu & ordering · Speisekarte & Bestellen · Menu & commande</div>
          <div class="flags">${flags}</div>
        </div>`).join('');
    } catch {
      location.href = '/staff?next=/staff/qr';
    }
  </script>
</body>
</html>
