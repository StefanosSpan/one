<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Εκτύπωση</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/print.css">
</head>
<body class="paper-80">
  <div class="print-bar">
    <b id="what"></b>
    <span class="grow"></span>
    <label class="small muted">Χαρτί
      <select class="input" id="paper">
        <option value="80">Θερμικός εκτυπωτής 80 mm</option>
        <option value="a4">A4</option>
      </select>
    </label>
    <button class="btn" id="printBtn">Εκτύπωση</button>
  </div>
  <div id="out"><div class="spinner"></div></div>
  <script type="module">
    import { api } from '/js/util.js';
    import { orderSlip, receiptSlip } from '/js/slips.js';
    import { marketFromServer } from '/js/lang.js';
    // Venues in the United States: English, dollars.
    await marketFromServer();

    const [, , , kind, id] = location.pathname.split('/'); // /staff/print/{order|receipt}/{id}
    const params = new URLSearchParams(location.search);
    const embed = params.has('embed'); // loaded in a hidden frame for automatic printing
    const $ = (s) => document.querySelector(s);

    let paper = params.get('paper');
    try { paper ||= localStorage.getItem('printPaper'); } catch { /* ignore */ }
    const setPaper = (p) => {
      paper = p === 'a4' ? 'a4' : '80';
      document.body.className = `paper-${paper}`;
      $('#paper').value = paper;
      let style = document.getElementById('page-size');
      if (!style) { style = document.createElement('style'); style.id = 'page-size'; document.head.append(style); }
      style.textContent = paper === 'a4' ? '@page { size: A4; margin: 15mm; }' : '@page { size: 80mm auto; margin: 3mm; }';
    };
    setPaper(paper);
    $('#paper').onchange = (e) => { setPaper(e.target.value); try { localStorage.setItem('printPaper', paper); } catch { /* ignore */ } };
    $('#printBtn').onclick = () => print();

    try {
      if (kind === 'order') {
        const { order: full, restaurant } = await api(`/api/staff/orders/${id}`);
        // ?station=bar prints only the dishes of that station (separate printers for kitchen and bar).
        const station = new URLSearchParams(location.search).get('station');
        const order = station ? { ...full, items: full.items.filter((i) => i.station === station) } : full;
        document.title = `Δελτίο παραγγελίας #${order.id}${station ? ` · ${station}` : ''}`;
        $('#what').textContent = document.title;
        $('#out').innerHTML = orderSlip(order, restaurant);
      } else {
        const { receipt, restaurant } = await api(`/api/staff/receipts/${id}`);
        document.title = `Απόδειξη ${receipt.number}`;
        $('#what').textContent = document.title;
        $('#out').innerHTML = receiptSlip(receipt, restaurant);
      }
      // Wait for the logo before printing.
      await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
      if (embed || params.has('auto')) setTimeout(() => print(), 150);
    } catch (e) {
      if (e.status === 401) location.href = `/staff?next=${encodeURIComponent(location.pathname)}`;
      else $('#out').innerHTML = `<p class="empty">${e.status === 404 ? 'Δεν βρέθηκε.' : 'Σφάλμα φόρτωσης.'}</p>`;
    }
  </script>
</body>
</html>
