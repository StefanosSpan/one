<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Εκτύπωση QR</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: #f5f5f5; }
    .toolbar { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: .8rem 1rem;
      display: flex; gap: .6rem 1.2rem; align-items: flex-end; flex-wrap: wrap; }
    .toolbar label { display: grid; gap: .2rem; font-size: .8rem; color: var(--muted); }
    .toolbar label.chk { display: flex; align-items: center; gap: .4rem; color: var(--text); font-size: .9rem; padding-bottom: .55rem; }
    .toolbar select { width: auto; padding: .45rem .6rem; }
    .toolbar .count { color: var(--muted); font-size: .88rem; padding-bottom: .55rem; margin-left: auto; }
    .hint { padding: .6rem 1rem; font-size: .85rem; color: var(--muted); }
    .paper { background: #fff; margin: 0 auto 2rem; max-width: 210mm; min-height: 297mm; padding: 10mm; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .sheetgrid { display: grid; gap: 5mm; justify-content: center; }
    .size-sticker .sheetgrid { grid-template-columns: repeat(4, 44mm); }
    .size-card .sheetgrid { grid-template-columns: repeat(3, 60mm); }
    .size-tent .sheetgrid { grid-template-columns: repeat(2, 90mm); }

    .qcard { border: .3mm solid #cfcfcf; border-radius: 2mm; text-align: center; break-inside: avoid; page-break-inside: avoid;
      display: flex; flex-direction: column; align-items: center; background: #fff; }
    .qcard .logo { object-fit: contain; }
    .qcard .rn { font-weight: 700; color: #1a1a1a; line-height: 1.2; }
    .qcard .tn { font-weight: 700; color: var(--brand); line-height: 1.1; }
    .qcard .tn-en { color: #6b6b6b; }
    .qcard .qr { position: relative; }
    .qcard .qr svg { width: 100%; height: 100%; display: block; }
    .qcard .qr .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 24%; height: 24%;
      background: #fff; border-radius: 12%; padding: 3%; display: grid; place-items: center; }
    .qcard .qr .center img { width: 100%; height: 100%; object-fit: contain; }
    .qcard .cta { font-weight: 600; color: #1a1a1a; }
    .qcard .sub, .qcard .codes { color: #6b6b6b; }

    .size-sticker .qcard { padding: 3mm 2.5mm; width: 44mm; }
    .size-sticker .logo { height: 7mm; max-width: 30mm; margin-bottom: 1mm; }
    .size-sticker .rn { font-size: 7pt; }
    .size-sticker .tn { font-size: 11pt; margin: .5mm 0 1.5mm; }
    .size-sticker .tn-en, .size-sticker .sub, .size-sticker .codes { display: none; }
    .size-sticker .qr { width: 32mm; height: 32mm; }
    .size-sticker .cta { font-size: 6.5pt; margin-top: 1.5mm; }

    .size-card .qcard { padding: 5mm 4mm; width: 60mm; }
    .size-card .logo { height: 11mm; max-width: 40mm; margin-bottom: 1.5mm; }
    .size-card .rn { font-size: 9.5pt; }
    .size-card .tn { font-size: 17pt; margin-top: 1mm; }
    .size-card .tn-en { font-size: 7.5pt; margin-bottom: 2.5mm; }
    .size-card .qr { width: 40mm; height: 40mm; }
    .size-card .cta { font-size: 9pt; margin-top: 2.5mm; }
    .size-card .sub { font-size: 7pt; margin-top: .6mm; }
    .size-card .codes { font-size: 6pt; margin-top: 1.5mm; letter-spacing: .04em; }

    .size-tent .qcard { padding: 8mm 6mm; width: 90mm; min-height: 128mm; justify-content: center; }
    .size-tent .logo { height: 18mm; max-width: 60mm; margin-bottom: 3mm; }
    .size-tent .rn { font-size: 13pt; }
    .size-tent .tn { font-size: 30pt; margin-top: 2mm; }
    .size-tent .tn-en { font-size: 10pt; margin-bottom: 5mm; }
    .size-tent .qr { width: 60mm; height: 60mm; }
    .size-tent .cta { font-size: 12pt; margin-top: 5mm; }
    .size-tent .sub { font-size: 9pt; margin-top: 1mm; }
    .size-tent .codes { font-size: 8pt; margin-top: 3mm; letter-spacing: .05em; }

    .size-poster .sheetgrid { grid-template-columns: repeat(1, 150mm); }
    .size-poster .qcard { padding: 14mm 10mm; width: 150mm; min-height: 200mm; justify-content: center; }
    .size-poster .logo { height: 26mm; max-width: 90mm; margin-bottom: 5mm; }
    .size-poster .rn { font-size: 20pt; }
    .size-poster .tn { font-size: 40pt; margin-top: 3mm; }
    .size-poster .tn-en { font-size: 14pt; margin-bottom: 7mm; }
    .size-poster .qr { width: 95mm; height: 95mm; }
    .size-poster .cta { font-size: 16pt; margin-top: 7mm; }
    .size-poster .sub { font-size: 12pt; margin-top: 1.5mm; }
    .size-poster .codes { font-size: 10pt; margin-top: 4mm; letter-spacing: .05em; }
    .size-poster .url { font-size: 11pt; }
    .qcard .url { color: #6b6b6b; font-size: 7pt; margin-top: 1mm; word-break: break-all; }
    .size-sticker .url { display: none; }

    @media print {
      body { background: #fff; }
      .toolbar, .hint { display: none; }
      .paper { box-shadow: none; margin: 0; padding: 0; max-width: none; min-height: 0; }
      @page { size: A4; margin: 10mm; }
    }
  </style>
</head>
<body>
  <div id="toasts"></div>
  <div class="toolbar">
    <label>Μέγεθος
      <select class="input" id="size">
        <option value="sticker">Αυτοκόλλητο (4,4 cm, 20 ανά σελίδα)</option>
        <option value="card" selected>Κάρτα (6 cm, 12 ανά σελίδα)</option>
        <option value="tent">Επιτραπέζια πινακίδα (A6, 4 ανά σελίδα)</option>
        <option value="poster" hidden>Αφίσα (A4)</option>
      </select>
    </label>
    <label id="copiesBox" hidden>Αντίγραφα
      <select class="input" id="copies"><option>1</option><option>2</option><option>4</option><option>8</option><option>12</option><option>20</option></select>
    </label>
    <label id="kindBox">Θέσεις
      <select class="input" id="kind">
        <option value="">Όλες</option>
        <option value="table">Τραπέζια</option>
        <option value="room">Δωμάτια</option>
        <option value="sunbed">Ξαπλώστρες</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="showLogo" checked> Λογότυπο στην κάρτα</label>
    <label class="chk"><input type="checkbox" id="logoInQr"> Λογότυπο μέσα στο QR</label>
    <span class="count" id="count"></span>
    <button class="btn" onclick="print()">Εκτύπωση</button>
  </div>
  <p class="hint" id="hint">Εκτυπώστε σε αυτοκόλλητο χαρτί ή χαρτόνι σε μέγεθος A4, χωρίς «προσαρμογή στη σελίδα». Κάθε QR ανοίγει το μενού της συγκεκριμένης θέσης.</p>
  <div class="paper size-card" id="paper"><div class="sheetgrid" id="grid"><div class="spinner"></div></div></div>

  <script type="module">
    import { api, esc } from '/js/util.js';
    import { LANGUAGES } from '/js/i18n.js';
    import { marketFromServer } from '/js/lang.js';
    // Venues in the United States: English, dollars.
    const US = (await marketFromServer()) === 'us';
    // Two lines on every card: Greek and English, or in the United States English and Spanish.
    const KIND = US
      ? { table: ['Table', 'Mesa'], room: ['Room', 'Habitación'], sunbed: ['Lounge chair', 'Tumbona'] }
      : { table: ['Τραπέζι', 'Table'], room: ['Δωμάτιο', 'Room'], sunbed: ['Ξαπλώστρα', 'Sunbed'] };
    const CTA = US ? ['Scan to view the menu and order', 'Escanee para ver el menú y pedir'] : ['Σκανάρετε για μενού και παραγγελία', 'Scan to view the menu and order'];
    // The menu link without a table (entrance, flyers, pick-up orders): ?menu=1
    const MENU_WORD = US ? ['Menu', 'Menú'] : ['Μενού', 'Menu'];
    const MENU_CTA = US
      ? { take: ['Scan for the menu and to order for pick-up', 'Escanee para ver el menú y pedir para llevar'], view: ['Scan to view the menu', 'Escanee para ver el menú'] }
      : { take: ['Σκανάρετε για το μενού και παραγγελία για παραλαβή', 'Scan for the menu and to order for pick-up'], view: ['Σκανάρετε για να δείτε το μενού', 'Scan to view the menu'] };
    const params = new URLSearchParams(location.search);
    const MENU = params.get('menu') === '1';
    const onlyIds = (params.get('ids') || '').split(',').filter(Boolean).map(Number);
    const $ = (s) => document.querySelector(s);

    let tables, s;
    const svgCache = new Map();
    const qrSvg = async (id, ecl) => {
      const key = `${id}:${ecl}`;
      const url = id === 'menu' ? `/api/admin/menu-qr.svg?ecl=${ecl}` : `/api/admin/tables/${id}/qr.svg?ecl=${ecl}`;
      if (!svgCache.has(key)) svgCache.set(key, await fetch(url).then((r) => r.text()));
      return svgCache.get(key);
    };

    async function render() {
      const size = $('#size').value;
      const kind = $('#kind').value;
      const logo = s.restaurant.logoUrl;
      const showLogo = $('#showLogo').checked && logo;
      const logoInQr = $('#logoInQr').checked && logo;
      $('#paper').className = `paper size-${size}`;
      const codes = s.languages.map((l) => LANGUAGES[l].short).join(' · ');
      if (MENU) {
        const n = Number($('#copies').value) || 1;
        const svg = await qrSvg('menu', logoInQr ? 'H' : 'M');
        const cta = s.takeaway?.enabled ? MENU_CTA.take : MENU_CTA.view;
        $('#count').textContent = `${n} QR`;
        $('#grid').innerHTML = Array.from({ length: n }, () => `<div class="qcard">
          ${showLogo ? `<img class="logo" src="${esc(logo)}" alt="">` : ''}
          <div class="rn">${esc(s.restaurant.name)}</div>
          <div class="tn" translate="no">${MENU_WORD[0]}</div>
          <div class="tn-en" translate="no">${MENU_WORD[1]}</div>
          <div class="qr">${svg}${logoInQr ? `<div class="center"><img src="${esc(logo)}" alt=""></div>` : ''}</div>
          <div class="cta" translate="no">${cta[0]}</div>
          <div class="sub" translate="no">${cta[1]}</div>
          <div class="url" translate="no">${esc(s.menuUrl.replace(/^https?:\/\//, ''))}</div>
          <div class="codes">${codes}</div>
        </div>`).join('');
        return;
      }
      const list = tables.filter((t) => t.active && (!onlyIds.length || onlyIds.includes(t.id)) && (!kind || t.kind === kind));
      $('#count').textContent = `${list.length} QR`;
      const svgs = await Promise.all(list.map((t) => qrSvg(t.id, logoInQr ? 'H' : 'M')));
      $('#grid').innerHTML = list.map((t, i) => {
        const [el, en] = KIND[t.kind] || KIND.table;
        return `<div class="qcard">
          ${showLogo ? `<img class="logo" src="${esc(logo)}" alt="">` : ''}
          <div class="rn">${esc(s.restaurant.name)}</div>
          <div class="tn" translate="no">${esc(el)} ${esc(t.label)}</div>
          <div class="tn-en" translate="no">${esc(en)} ${esc(t.label)}</div>
          <div class="qr">${svgs[i]}${logoInQr ? `<div class="center"><img src="${esc(logo)}" alt=""></div>` : ''}</div>
          <div class="cta" translate="no">${CTA[0]}</div>
          <div class="sub" translate="no">${CTA[1]}</div>
          <div class="codes">${codes}</div>
        </div>`;
      }).join('') || '<p class="muted">Δεν υπάρχουν ενεργές θέσεις για εκτύπωση.</p>';
    }

    try {
      [tables, s] = await Promise.all([api('/api/admin/tables'), api('/api/admin/settings')]);
    } catch {
      location.href = `/staff?next=${encodeURIComponent('/staff/qr')}`;
    }
    if (s.brandColor) document.documentElement.style.setProperty('--brand', s.brandColor);
    if (!s.restaurant.logoUrl) {
      $('#showLogo').closest('label').hidden = true;
      $('#logoInQr').closest('label').hidden = true;
      $('#hint').textContent += ' Ανεβάστε λογότυπο στη Διαχείριση → Κατάστημα για να εμφανίζεται στις κάρτες.';
    }
    if (onlyIds.length === 1) $('#size').value = 'tent';
    if (MENU) {
      document.title = US ? 'Print the menu QR' : 'Εκτύπωση QR μενού';
      $('#kindBox').hidden = true;
      $('#copiesBox').hidden = false;
      $('#size').querySelector('[value=poster]').hidden = false;
      $('#size').value = 'poster';
      $('#hint').textContent = 'Αφίσα για την είσοδο ή τη βιτρίνα, κάρτες για το ταμείο και τις σακούλες της παραλαβής. Το QR ανοίγει το μενού χωρίς τραπέζι.';
      $('#size').addEventListener('change', () => { $('#copies').value = { poster: '1', tent: '4', card: '12', sticker: '20' }[$('#size').value]; });
    }
    ['#size', '#kind', '#copies', '#showLogo', '#logoInQr'].forEach((sel) => $(sel).addEventListener('change', render));
    render();
  </script>
</body>
</html>
