# Deployment on Render (https://render.com): Dashboard → New → Blueprint → choose this repository.
#
# Starts on the free plan. The database is a free PostgreSQL on Neon (https://neon.tech, region Frankfurt):
# paste its connection string into DATABASE_URL when Render asks.
# Before real customers use it, switch the web service to "Starter" (Settings → Instance Type): the free
# plan sleeps after 15 minutes without visits and the next QR scan waits up to a minute.
services:
  - type: web
    name: kalimenu
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL        # from Neon: postgresql://…neon.tech/neondb?sslmode=require
        sync: false
      - key: APP_URL
        value: https://kalimenu.gr
      - key: REDIRECT_HOSTS      # these domains redirect to APP_URL
        value: kalimenu.com,www.kalimenu.com,www.kalimenu.gr
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Kalimenu <hello@kalimenu.gr>
      - key: NOTIFY_EMAIL        # where new sign-ups are announced
        sync: false
      # Your business details, shown in the footer, terms and privacy policy
      - key: COMPANY_NAME        # your full name (sole trader) or company name
        sync: false
      - key: COMPANY_VAT         # ΑΦΜ
        sync: false
      - key: COMPANY_TAX_OFFICE  # ΔΟΥ
        sync: false
      - key: COMPANY_GEMI        # αριθμός ΓΕΜΗ
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: CONTACT_EMAIL       # e.g. hello@kalimenu.gr
        sync: false
      - key: CONTACT_PHONE
        sync: false
