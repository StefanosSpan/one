<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Sign in · Kalimenu</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div id="toasts"></div>
  <header class="auth-top"><div class="in">
    <a class="wordmark" href="/"><img src="/brand/logo.svg" alt="Kalimenu" width="133" height="26"></a>
    <a class="link" href="/signup">Create account</a>
  </div></header>

  <main class="auth">
    <!-- Owner login -->
    <form class="card" id="login" hidden>
      <h1>Owner sign in</h1>
      <p class="lead">Manage your menu, QR codes, staff and subscription.</p>
      <label class="field"><span>E-mail</span><input class="input" name="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Password</span><input class="input" name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn block">Sign in</button>
      <p class="foot"><a href="#forgot">Forgot your password?</a></p>
    </form>

    <!-- Forgotten password -->
    <form class="card" id="forgot" hidden>
      <h1>Reset your password</h1>
      <p class="lead">We will send you a link to set a new password.</p>
      <label class="field"><span>E-mail</span><input class="input" name="email" type="email" required autocomplete="email"></label>
      <button class="btn block">Send link</button>
      <p class="foot"><a href="#">Back to sign in</a></p>
    </form>

    <!-- Reset link from the e-mail -->
    <form class="card" id="reset" hidden>
      <h1>Set a new password</h1>
      <label class="field"><span>New password</span><input class="input" name="password" type="password" minlength="8" required autocomplete="new-password">
        <p class="hint">At least 8 characters.</p></label>
      <button class="btn block">Save and sign in</button>
    </form>

  </main>
  <footer class="legal-foot"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/cookies">Cookies</a> · Built by <a href="https://walkupdigital.com" target="_blank" rel="noopener">Walkup Digital</a></footer>

  <script type="module">
    import { api, toast } from '/js/util.js';
    import { setMarket } from '/js/lang.js';
    import '/js/cookies.js';
    setMarket('us'); // messages from the server in English
    const token = new URLSearchParams(location.search).get('token');
    const show = () => {
      const view = location.pathname === '/reset' && token ? 'reset' : location.hash === '#forgot' ? 'forgot' : 'login';
      for (const id of ['login', 'forgot', 'reset']) document.getElementById(id).hidden = id !== view;
    };
    window.addEventListener('hashchange', show);
    show();
    const fail = (e) => toast(e.message === 'error' ? 'Something went wrong. Please try again.' : e.message, 'err');

    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      try { location.href = (await api('/api/account/login', { method: 'POST', body: { email: f.email.value, password: f.password.value } })).next; }
      catch (err) { fail(err); }
    });
    document.getElementById('forgot').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/account/forgot', { method: 'POST', body: { email: e.target.email.value } });
        toast('If an account exists for this e-mail, you will receive a link in a few minutes.', 'ok');
      } catch (err) { fail(err); }
    });
    document.getElementById('reset').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { location.href = (await api('/api/account/reset', { method: 'POST', body: { token, password: e.target.password.value } })).next; }
      catch (err) { fail(err); }
    });
  </script>
</body>
</html>
