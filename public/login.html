<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Σύνδεση · Kalimenu</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div id="toasts"></div>
  <header class="auth-top"><div class="in">
    <a class="wordmark" href="/"><img src="/brand/logo.svg" alt="Kalimenu" width="147" height="29"></a>
    <a class="link" href="/signup">Νέος λογαριασμός</a>
  </div></header>

  <main class="auth">
    <!-- Owner login -->
    <form class="card" id="login" hidden>
      <h1>Σύνδεση ιδιοκτήτη</h1>
      <p class="lead">Διαχείριση μενού, QR, προσωπικού και συνδρομής.</p>
      <label class="field"><span>E-mail</span><input class="input" name="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Κωδικός</span><input class="input" name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn block">Σύνδεση</button>
      <p class="foot"><a href="#forgot">Ξεχάσατε τον κωδικό;</a></p>
    </form>

    <!-- Forgotten password -->
    <form class="card" id="forgot" hidden>
      <h1>Νέος κωδικός</h1>
      <p class="lead">Θα σας στείλουμε σύνδεσμο για να ορίσετε νέο κωδικό.</p>
      <label class="field"><span>E-mail</span><input class="input" name="email" type="email" required autocomplete="email"></label>
      <button class="btn block">Αποστολή συνδέσμου</button>
      <p class="foot"><a href="#">Πίσω στη σύνδεση</a></p>
    </form>

    <!-- Reset link from the e-mail -->
    <form class="card" id="reset" hidden>
      <h1>Ορίστε νέο κωδικό</h1>
      <label class="field"><span>Νέος κωδικός</span><input class="input" name="password" type="password" minlength="8" required autocomplete="new-password">
        <p class="hint">Τουλάχιστον 8 χαρακτήρες.</p></label>
      <button class="btn block">Αποθήκευση και σύνδεση</button>
    </form>

    <p class="foot">Είστε σερβιτόρος ή στην κουζίνα; <a href="/staff">Σύνδεση με PIN</a></p>
  </main>

  <script type="module">
    import { api, toast } from '/js/util.js';
    const token = new URLSearchParams(location.search).get('token');
    const show = () => {
      const view = location.pathname === '/reset' && token ? 'reset' : location.hash === '#forgot' ? 'forgot' : 'login';
      for (const id of ['login', 'forgot', 'reset']) document.getElementById(id).hidden = id !== view;
    };
    window.addEventListener('hashchange', show);
    show();
    const fail = (e) => toast(e.message === 'error' ? 'Κάτι πήγε στραβά. Δοκιμάστε ξανά.' : e.message, 'err');

    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      try { location.href = (await api('/api/account/login', { method: 'POST', body: { email: f.email.value, password: f.password.value } })).next; }
      catch (err) { fail(err); }
    });
    document.getElementById('forgot').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/account/forgot', { method: 'POST', body: { email: e.target.email.value } });
        toast('Αν υπάρχει λογαριασμός με αυτό το e-mail, θα λάβετε σύνδεσμο σε λίγα λεπτά.', 'ok');
      } catch (err) { fail(err); }
    });
    document.getElementById('reset').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { location.href = (await api('/api/account/reset', { method: 'POST', body: { token, password: e.target.password.value } })).next; }
      catch (err) { fail(err); }
    });
  </script>
</body>
</html>
