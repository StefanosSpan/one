# One-click deployment on Render (https://render.com): Dashboard → New → Blueprint → choose this repository.
# Creates the web service and a PostgreSQL database in Frankfurt (EU). Fill in the secret values when asked.
services:
  - type: web
    name: kalimenu
    runtime: node
    region: frankfurt
    plan: starter            # always on; the free plan sleeps and would delay the first menu scan
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kalimenu-db
          property: connectionString
      - key: APP_URL             # e.g. https://kalimenu.gr
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM           # e.g. Kalimenu <hello@kalimenu.gr>
        sync: false
      - key: NOTIFY_EMAIL        # where new sign-ups are announced
        sync: false

databases:
  - name: kalimenu-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
