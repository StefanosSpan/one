<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Εκτύπωση QR</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: #fff; }
    .toolbar { padding: 1rem; display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    .sheetgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62mm, 1fr)); gap: 5mm; padding: 6mm; }
    .qcard { border: .3mm solid #cfcfcf; border-radius: 2mm; padding: 6mm 5mm 5mm; text-align: center; break-inside: avoid; }
    .qcard .rn { font-size: 11pt; font-weight: 700; color: #1a1a1a; }
    .qcard .tn { font-size: 20pt; font-weight: 700; margin: 1mm 0 3mm; color: var(--brand); }
    .qcard .qr { width: 40mm; height: 40mm; margin: 0 auto; }
    .qcard .qr svg { width: 100%; height: 100%; }
    .qcard .cta { font-size: 9.5pt; font-weight: 600; margin-top: 3mm; color: #1a1a1a; }
    .qcard .sub { font-size: 7.5pt; color: #6b6b6b; margin-top: .8mm; }
    .qcard .codes { font-size: 6.5pt; margin-top: 2mm; color: #9a9a9a; letter-spacing: .05em; }
    @media print { .toolbar { display: none; } .sheetgrid { padding: 0; } @page { margin: 10mm; } }
  </style>
</head>
<body>
  <div id="toasts"></div>
  <div class="toolbar">
    <button class="btn" onclick="print()">Εκτύπωση</button>
    <span class="muted small">Εκτυπώστε σε αυτοκόλλητο ή χαρτόνι. Κάθε QR αντιστοιχεί σε συγκεκριμένη θέση (τραπέζι, δωμάτιο ή ξαπλώστρα).</span>
  </div>
  <div class="sheetgrid" id="grid"><div class="spinner"></div></div>
  <script type="module">
    import { api, esc } from '/js/util.js';
    import { LANGUAGES } from '/js/i18n.js';
    const KIND = { table: 'Τραπέζι', room: 'Δωμάτιο', sunbed: 'Ξαπλώστρα' };
    try {
      const [tables, s] = await Promise.all([api('/api/admin/tables'), api('/api/admin/settings')]);
      const codes = s.languages.map((l) => LANGUAGES[l].short).join(' · ');
      if (s.brandColor) document.documentElement.style.setProperty('--brand', s.brandColor);
      const active = tables.filter((t) => t.active);
      const svgs = await Promise.all(active.map((t) => fetch(`/api/admin/tables/${t.id}/qr.svg`).then((r) => r.text())));
      document.getElementById('grid').innerHTML = active.map((t, i) => `
        <div class="qcard">
          <div class="rn">${esc(s.restaurant.name)}</div>
          <div class="tn">${esc(KIND[t.kind] || KIND.table)} ${esc(t.label)}</div>
          <div class="qr">${svgs[i]}</div>
          <div class="cta">Σκανάρετε για μενού και παραγγελία</div>
          <div class="sub">Scan to view the menu and order</div>
          <div class="codes">${codes}</div>
        </div>`).join('');
    } catch {
      location.href = '/staff?next=/staff/qr';
    }
  </script>
</body>
</html>
