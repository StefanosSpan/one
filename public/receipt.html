<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Receipt</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/print.css">
  <style>
    body { background: #f5f5f5; }
    .guest-bar { max-width: 80mm; margin: 1rem auto 0; display: flex; gap: .5rem; }
    .guest-bar .btn { flex: 1; }
    .slip { width: min(92vw, 360px); }
    .rate { max-width: min(92vw, 360px); margin: 1rem auto 2rem; padding: 1.1rem 1rem; text-align: center; background: #fff; border: 1px solid var(--line);
      border-radius: 18px; box-shadow: var(--shadow-sm); }
    .rate > b { display: block; font-size: 1.05rem; }
    .rate p { margin: 0 0 .8rem; }
    .rate .stars { display: flex; justify-content: center; gap: .3rem; margin: .6rem 0; }
    .rate .stars button { border: 0; background: none; color: var(--faint); padding: .25rem; }
    .rate .stars button.on { color: #e0a100; }
    .rate .stars button.on svg { fill: currentColor; }
    @media print { .guest-bar, .rate { display: none; } .slip { width: 72mm; } @page { size: 80mm auto; margin: 3mm; } }
  </style>
</head>
<body>
  <div id="out"><div class="spinner"></div></div>
  <div class="guest-bar" id="bar" hidden><button class="btn" id="save"></button></div>
  <div class="rate" id="rate" hidden></div>
  <script type="module">
    import { api } from '/js/util.js';
    import { STRINGS } from '/js/i18n.js';
    import { receiptSlip } from '/js/slips.js';
    import { icon } from '/js/icons.js';
    const token = location.pathname.split('/').pop();
    const params = new URLSearchParams(location.search);
    try {
      const { receipt, restaurant, feedback } = await api(`/api/public/receipt/${token}`);
      const lang = STRINGS[params.get('lang')] ? params.get('lang') : STRINGS[receipt.lang] ? receipt.lang : 'el';
      const t = (k, fallback) => STRINGS[lang]?.[k] ?? STRINGS.en[k] ?? fallback ?? k;
      document.documentElement.lang = lang;
      document.title = `${t('receipt')} ${receipt.number}`;
      document.getElementById('out').innerHTML = receiptSlip(receipt, restaurant, { lang, t });
      const btn = document.getElementById('save');
      btn.textContent = t('saveReceipt');
      btn.onclick = () => print();
      if (restaurant.brandColor) document.documentElement.style.setProperty('--brand', restaurant.brandColor);
      document.getElementById('bar').hidden = false;
      // Rating the visit: 4-5 stars lead to the venue's Google reviews, 1-3 stay private with a comment.
      const box = document.getElementById('rate');
      const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const done = (url) => {
        box.innerHTML = `<p><b>${esc(t('rateThanks'))}</b>${url ? `<br>${esc(t('rateGoogle'))}` : ''}</p>${url
          ? `<a class="btn block" href="${esc(url)}" target="_blank" rel="noopener">${icon('star', 16)} ${esc(t('writeReview'))}</a>` : ''}`;
      };
      if (feedback) {
        box.hidden = false;
        box.innerHTML = `<b>${esc(t('rateUs'))}</b><div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-star="${n}" aria-label="${n}">${icon('star', 30)}</button>`).join('')}</div>
          <div id="more" hidden><textarea class="input" id="cm" rows="3" maxlength="1000" placeholder="${esc(t('commentPh'))}"></textarea>
          <button class="btn block" id="send" style="margin-top:.5rem">${esc(t('send'))}</button></div>`;
        let rating = 0;
        const send = async () => {
          try {
            const r = await api(`/api/public/receipt/${token}/feedback`, { method: 'POST', body: { rating, comment: document.getElementById('cm')?.value || '', lang } });
            done(r.reviewUrl);
          } catch { done(''); }
        };
        box.querySelectorAll('[data-star]').forEach((b) => b.onclick = () => {
          rating = Number(b.dataset.star);
          box.querySelectorAll('[data-star]').forEach((x) => x.classList.toggle('on', Number(x.dataset.star) <= rating));
          if (rating >= 4) send(); else { document.getElementById('more').hidden = false; document.getElementById('cm').focus(); }
        });
        box.addEventListener('click', (e) => { if (e.target.id === 'send') { e.target.disabled = true; send(); } });
      }
    } catch {
      document.getElementById('out').innerHTML = '<p class="empty">Not found</p>';
    }
  </script>
</body>
</html>
