<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <title>Page not found · Kalimenu</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    .nf { max-width: 520px; margin: 4rem auto 3rem; padding: 0 16px; text-align: center; }
    .nf .code { font-size: clamp(4rem, 18vw, 7rem); font-weight: 800; letter-spacing: -.06em; line-height: 1; margin: 0;
      background: linear-gradient(135deg, #1f3a5f, #d2643c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .nf h1 { font-size: 1.6rem; margin: .8rem 0 .5rem; }
    .nf p { color: var(--muted); margin: 0 0 1.6rem; }
    .nf .row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
    .nf .btn { min-height: 48px; border-radius: 12px; }
  </style>
</head>
<body>
  <header class="auth-top"><div class="in"><a class="wordmark" href="/"><img src="/brand/logo.svg" alt="Kalimenu" width="133" height="26"></a></div></header>
  <main class="nf">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The link may have changed or no longer exists. If you scanned a QR code at a restaurant, please ask the staff for help.</p>
    <div class="row"><a class="btn" href="/">Home page</a><a class="btn secondary" href="/demo">See the demo</a></div>
  </main>
</body>
</html>
